services:
  - type: web
    name: chatx
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ALLOWED_ORIGINS
        value: "https://chatx-uxfq.onrender.com,http://localhost:3000,http://localhost:3001"
